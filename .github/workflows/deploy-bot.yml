name: Deploy Slack Bot

on:
  push:
    branches: [main]
    paths:
      - src/**
      - requirements.txt
      - Dockerfile.slack
      - docker-compose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.slack -t vantaops-slack:${{ github.sha }} .

      - name: Tag latest
        run: docker tag vantaops-slack:${{ github.sha }} vantaops-slack:latest

